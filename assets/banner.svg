<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Animated Tech Grid Glow Gradient -->
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1">
        <animate attributeName="stop-color" values="#6366f1;#a855f7;#06b6d4;#6366f1" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#3b82f6">
        <animate attributeName="stop-color" values="#3b82f6;#ec4899;#10b981;#3b82f6" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <radialGradient id="pulse-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .title-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: url(#text-grad);
    }
    .subtitle-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #e2e8f0;
    }
    .tag-badge {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #38bdf8;
    }
    .grid-line {
      stroke: #334155;
      stroke-opacity: 0.3;
      stroke-width: 1;
    }
    .pulse-node {
      animation: pulse 3s infinite ease-in-out;
    }
    @keyframes pulse {
      0% { r: 4px; opacity: 0.4; }
      50% { r: 8px; opacity: 0.9; }
      100% { r: 4px; opacity: 0.4; }
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)"/>

  <!-- Background Decorative Grid Lines -->
  <g class="grid-line">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>

    <line x1="150" y1="0" x2="150" y2="360"/>
    <line x1="350" y1="0" x2="350" y2="360"/>
    <line x1="550" y1="0" x2="550" y2="360"/>
    <line x1="750" y1="0" x2="750" y2="360"/>
    <line x1="950" y1="0" x2="950" y2="360"/>
    <line x1="1150" y1="0" x2="1150" y2="360"/>
  </g>

  <!-- Dynamic Glowing Radial Orbs in Background -->
  <circle cx="1000" cy="120" r="180" fill="url(#pulse-glow)"/>
  <circle cx="200" cy="260" r="140" fill="url(#pulse-glow)"/>

  <!-- Dynamic Network / RAG Graph Nodes -->
  <g stroke="url(#glow-grad)" stroke-width="1.5" stroke-opacity="0.6" fill="none">
    <path d="M 850,90 L 930,150 L 1050,110 L 1120,200 L 1010,260 L 920,210 Z"/>
    <path d="M 930,150 L 1010,260"/>
    <path d="M 850,90 L 1050,110"/>
  </g>

  <!-- Network Glowing Nodes -->
  <circle cx="850" cy="90" r="6" fill="#38bdf8" class="pulse-node"/>
  <circle cx="930" cy="150" r="7" fill="#818cf8" class="pulse-node"/>
  <circle cx="1050" cy="110" r="6" fill="#c084fc" class="pulse-node"/>
  <circle cx="1120" cy="200" r="7" fill="#f472b6" class="pulse-node"/>
  <circle cx="1010" cy="260" r="8" fill="#60a5fa" class="pulse-node"/>
  <circle cx="920" cy="210" r="5" fill="#34d399" class="pulse-node"/>

  <!-- Top Decorative Border Accent -->
  <rect x="0" y="0" width="1200" height="5" fill="url(#glow-grad)"/>

  <!-- Tag Pill Badge -->
  <rect x="70" y="55" width="230" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="85" y="76" class="tag-badge">⚡ AWESOME AI SEARCH</text>

  <!-- Foreground Main Title & Subtitle -->
  <text x="70" y="145" class="title-text">Awesome AI Enterprise Search 🔍</text>
  <text x="70" y="195" class="subtitle-text">Curated Ecosystem of SaaS Platforms, Open-Source RAG Engines &amp; Permission Search</text>

  <!-- Feature Highlights / Pills -->
  <g transform="translate(70, 240)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="170" height="38" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="18" y="24" font-family="sans-serif" font-weight="600" font-size="14" fill="#cbd5e1">🏢 SaaS Solutions</text>

    <!-- Pill 2 -->
    <rect x="185" y="0" width="180" height="38" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="203" y="24" font-family="sans-serif" font-weight="600" font-size="14" fill="#cbd5e1">💻 Open-Source RAG</text>

    <!-- Pill 3 -->
    <rect x="380" y="0" width="180" height="38" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="398" y="24" font-family="sans-serif" font-weight="600" font-size="14" fill="#cbd5e1">🔒 ACL &amp; Governance</text>
  </g>
</svg>
